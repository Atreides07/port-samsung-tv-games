name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate skill and links
        run: python3 scripts/validate.py
      - name: Test distribution boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Build portable skill ZIP
        run: python3 scripts/package.py
      - name: Upload portable skill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: port-samsung-tv-games
          path: dist/port-samsung-tv-games.zip
          if-no-files-found: error
